  cols:["Сильно помогают","Скорее помогают","Не помогают и не вредят","Скорее вредят","Сильно вредят","Не знаю",NA]},
 {id:"Q12",page:4,type:"single",text:"Как вы оцениваете отношения между Кишинёвом и Комратом?",
  opts:["Очень хорошие","Хорошие","Нейтральные","Плохие","Очень плохие","Не знаю",NA]},
 {id:"Q13",page:4,type:"single",text:"На каком языке вы говорите дома?",
  opts:["Русский","Гагаузский","Смешанный русский и гагаузский","Молдавский / Румынский","Болгарский","Украинский","Другой (укажите)",NA],other:"Другой (укажите)"},

 {id:"Q14",page:5,type:"single",text:"Ваш пол",opts:["Мужской","Женский"]},
 {id:"Q15",page:5,type:"single",text:"Сколько вам лет?",opts:["18–29","30–44","45–59","60+"],last:true}
];
// Порядок показа на единой странице (page сохраняется только для столбца last_page — совместимость с v1/v2)
const ORDER=["Q5","Q6","Q1","Q2","Q3","Q4","Q7","Q8","Q9","Q10","Q11","Q12","Q13","Q14","Q15"];
const QS=ORDER.map(id=>QUESTIONS.find(q=>q.id===id));
const PAGES=5;


/* ======================= СОСТОЯНИЕ ======================= */
const STORE="sv_"+SURVEY_ID;
const params=new URLSearchParams(location.search);
let S;
function load(){
  try{ if(params.get("reset")) localStorage.removeItem(STORE); S=JSON.parse(localStorage.getItem(STORE)||"null"); }catch(e){ S=null; }
  if(!S){
    S={id:uid(),src:params.get("src")||"direct",started:new Date().toISOString(),page:1,status:"partial",a:{},order:{}};
  }
  if(!S.src||S.src==="direct") S.src=params.get("src")||S.src||"direct";
  // Миграция с постраничной версии: ответы сохраняются, страница одна
  if(S.status==="complete"||S.page>PAGES) S.page=2; else S.page=1;
}
function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
function uid(){ const b=new Uint8Array(12); crypto.getRandomValues(b); return Array.from(b,x=>x.toString(16).padStart(2,"0")).join(""); }
function districtOf(a){
  if(!a.Q8||a.Q8===NA) return null;
  const d=LOC_DISTRICTS[a.Q8]; if(!d) return null;
  if(d.length===1) return d[0];
  const v=parseInt(String(a.Q9||"").replace(/\D/g,""),10); return (v&&d.includes(v))?v:null;
}
function unknownDistrict(a){ return !!a.Q8&&a.Q8!==NA&&(LOC_DISTRICTS[a.Q8]||[]).length>1&&a.Q9==="Не знаю"; }
function effDistrict(a){ return districtOf(a)||(a.Q10_district?parseInt(a.Q10_district,10):null); }
function order(q){ // устойчивый случайный порядок для респондента
  const key=q.id+(q.id==="Q10"?"_"+districtOf(S.a):"");
  const base=q.id==="Q10"?(CANDIDATES[districtOf(S.a)]||{c:[]}).c.map(c=>c[0]):q.opts;
  const n=q.id==="Q10"?base.length:(q.random||0);
  if(!n) return base;
  if(!S.order[key]||S.order[key].length!==base.length){
    const idx=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    S.order[key]=[...idx,...Array.from({length:base.length-n},(_,i)=>n+i)]; save();
  }
  return S.order[key].map(i=>base[i]);
}

/* ======================= РЕНДЕР ======================= */
const main=document.getElementById("main");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function visibleQs(){ return QS.filter(q=>!q.show||q.show(S.a)); }
function setProgress(){
  const vis=visibleQs(), n=vis.filter(answered).length;
  document.getElementById("pbar").style.width=(S.page>1?100:(vis.length?n/vis.length*100:0))+"%";
  document.getElementById("pcount").textContent=S.page>1?"":`Отвечено ${n} из ${vis.length}`;
}
function render(){
  if(S.page>1) return renderThanks();
  main.innerHTML=`<div class="card intro">
  <p class="lead">Какие проблемы для вас важнее всего и кому из кандидатов вы доверяете?</p>
  <p>15 ноября 2026 года пройдут выборы башкана и Народного Собрания Гагаузии. Расскажите, что вы думаете сегодня.</p>
  <p>Опрос полностью анонимен и занимает 3–4 минуты. Мы не собираем имена, телефоны или другие личные данные. Все вопросы на одной странице — просто листайте вниз.</p></div>`;
  QS.forEach(q=>main.appendChild(renderQ(q)));
  const sub=document.createElement("div"); sub.className="submit"; sub.id="submit";
  sub.innerHTML=`<button class="btn-next" id="finish">Отправить ответы</button><p class="small">Ответы сохраняются и во время заполнения.</p>`;
  main.appendChild(sub);
  document.getElementById("finish").onclick=finish;
  refreshVisibility();
}
function renderThanks(){
  main.innerHTML=`<div class="card thanks"><h2>Спасибо!</h2><p>Ваши ответы сохранены.</p><p class="small">Отправьте ссылку друзьям и соседям: чем больше ответов, тем точнее картина.</p></div>`;
  setProgress(); window.scrollTo(0,0);
}
function renderQ(q){
  const card=document.createElement("div"); card.className="card"; card.id="card_"+q.id; card.dataset.q=q.id;
  let h=`<p class="q">${esc(q.text)}</p>`;
  if(q.hint||q.dyn) h+=`<p class="hint">${esc(q.hint||"")}</p>`;
  h+=`<p class="errmsg"></p>`;
  if(q.type==="select"){
    h+=`<select>${q.placeholder?`<option value="">${esc(q.placeholder)}</option>`:""}${q.opts.map(o=>`<option ${S.a[q.id]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  }else if(q.type==="matrix"){
    h+=`<div class="matrix">`+q.rows.map((r,ri)=>`<div class="mrow"><div class="rl">${esc(r)}</div><div class="opts">`+
      q.cols.map(c=>{const name=q.id+"_"+ri;const sel=(S.a[q.id]||{})[r]===c;return `<label class="opt ${sel?"sel":""}"><input type="radio" name="${name}" value="${esc(c)}" ${sel?"checked":""}><span class="lbl">${esc(c)}</span></label>`;}).join("")+`</div></div>`).join("")+`</div>`;
  }else{
    h+=`<div class="opts"></div>`;
  }
  h+=`<div class="qnav"><button type="button" class="btn-nq">Следующий вопрос ↓</button></div>`;
  card.innerHTML=h;
  card.querySelector(".btn-nq").onclick=()=>scrollNext(q);
  if(q.type==="select"){ card.querySelector("select").onchange=e=>{S.a[q.id]=e.target.value||undefined; if(q.id==="Q8"){delete S.a.Q9;delete S.a.Q10;delete S.a.Q10_district;} changed(card);}; }
  else if(q.type==="matrix"){ card.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{const ri=+inp.name.split("_")[1];S.a[q.id]=S.a[q.id]||{};S.a[q.id][q.rows[ri]]=inp.value;card.querySelectorAll(`input[name="${inp.name}"]`).forEach(i=>i.closest(".opt").classList.toggle("sel",i.checked));changed(card);}); }
  else if(!q.dyn) fillOpts(q,card);
  return card;
}
function scrollNext(q){
  const vis=visibleQs(); const i=vis.indexOf(q);
  const nxt=vis[i+1]; const el=nxt?document.getElementById("card_"+nxt.id):document.getElementById("submit");
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
function changed(card){ // любое изменение ответа
  card.classList.remove("err"); save(); refreshVisibility(); queueSend();
}
function fillOpts(q,card){
  const box=card.querySelector(".opts"); box.innerHTML="";
  let opts, parties={};
  if(q.id==="Q9"){ const d=LOC_DISTRICTS[S.a.Q8]||[]; opts=[...d.map(n=>"Округ № "+n),"Не знаю"]; card.querySelector(".hint").textContent=`Для ${S.a.Q8} — несколько округов.`; }
  else if(q.id==="Q10"){ const d=districtOf(S.a); if(d){ CANDIDATES[d].c.forEach(c=>parties[c[0]]=c[1]); opts=[...order(q),...TAIL_CAND]; card.querySelector(".hint").textContent=`${CANDIDATES[d].n}, избирательный округ № ${d}`; }
    else if(unknownDistrict(S.a)){ return fillGrouped(q,card); } else return; }
  else opts=order(q);
  const multi=q.type==="multi"; const cur=S.a[q.id];
  opts.forEach(o=>{
    const sel=multi?(Array.isArray(cur)&&cur.includes(o)):cur===o;
    const l=document.createElement("label"); l.className="opt"+(sel?" sel":"");
    l.innerHTML=`<input type="${multi?"checkbox":"radio"}" name="${q.id}" value="${esc(o)}" ${sel?"checked":""}><span class="lbl">${esc(o)}${parties[o]?` <span class="party">— ${esc(parties[o])}</span>`:""}</span>`;
    if(q.other===o){ const t=document.createElement("input"); t.type="text"; t.maxLength=120; t.placeholder="Уточните…"; t.value=S.a[q.id+"_other"]||""; t.onclick=e=>e.stopPropagation(); t.oninput=()=>{S.a[q.id+"_other"]=t.value;save();queueSend();}; l.querySelector(".lbl").appendChild(t); }
    box.appendChild(l);
  });
  if(q.id==="Q9"){ const n=document.createElement("p"); n.className="note"; n.innerHTML=`Не знаете номер округа? <a href="https://cece.cec.md/sites/default/files/2026-09/anexa.pdf" target="_blank" rel="noopener">Посмотрите границы округов по улицам (PDF ЦИС)</a>.`; box.appendChild(n); }
  box.querySelectorAll("input[type=radio],input[type=checkbox]").forEach(inp=>inp.onchange=()=>onPick(q,card,inp));
  if(multi) applyMultiState(q,card);
}
function fillGrouped(q,card){
  const box=card.querySelector(".opts"); box.innerHTML="";
  card.querySelector(".hint").textContent=`Вы не знаете номер округа — ниже все кандидаты по округам (${S.a.Q8}). Выберите одного кандидата: ваш округ определится по нему.`;
  const cur=S.a.Q10, curD=S.a.Q10_district;
  const mk=(val,label,party,sel)=>{const l=document.createElement("label"); l.className="opt"+(sel?" sel":""); l.innerHTML=`<input type="radio" name="Q10" value="${esc(val)}" ${sel?"checked":""}><span class="lbl">${esc(label)}${party?` <span class="party">— ${esc(party)}</span>`:""}</span>`; return l;};
  for(const d of LOC_DISTRICTS[S.a.Q8]){
    const h=document.createElement("p"); h.className="hint"; h.style.margin="10px 0 4px"; h.style.fontWeight="600"; h.textContent=`Округ № ${d}`; box.appendChild(h);
    const names=CANDIDATES[d].c.map(c=>c[0]); const key="Q10_"+d;
    if(!S.order[key]||S.order[key].length!==names.length){const idx=[...Array(names.length).keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}S.order[key]=idx;save();}
    S.order[key].map(i=>CANDIDATES[d].c[i]).forEach(c=>box.appendChild(mk(d+"|"+c[0],c[0],c[1],cur===c[0]&&String(curD)===String(d))));
  }
  const h=document.createElement("p"); h.className="hint"; h.style.margin="10px 0 4px"; box.appendChild(h);
  TAIL_CAND.forEach(o=>box.appendChild(mk("0|"+o,o,"",cur===o&&!curD)));
  box.querySelectorAll("input[type=radio]").forEach(inp=>inp.onchange=()=>{
    const [d,name]=inp.value.split("|"); S.a.Q10=name; if(d!=="0") S.a.Q10_district=d; else delete S.a.Q10_district;
    card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
    changed(card);
  });
}
function onPick(q,card,inp){
  if(q.type==="multi"){
    let arr=Array.isArray(S.a[q.id])?[...S.a[q.id]]:[];
    const isEx=(q.exclusive||[]).includes(inp.value);
    if(inp.checked){ if(isEx) arr=[inp.value]; else { arr=arr.filter(v=>!(q.exclusive||[]).includes(v)); arr.push(inp.value); } }
    else arr=arr.filter(v=>v!==inp.value);
    S.a[q.id]=arr; applyMultiState(q,card); changed(card);
  }else{
    S.a[q.id]=inp.value;
    if(q.id==="Q9"){ delete S.a.Q10; delete S.a.Q10_district; }
    card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
    changed(card);
    if(q.last&&visibleQs().every(answered)) finish();
  }
}
function applyMultiState(q,card){
  const arr=S.a[q.id]||[]; const full=q.max&&arr.length>=q.max; const ex=arr.some(v=>(q.exclusive||[]).includes(v));
  card.querySelectorAll(".opt").forEach(o=>{const i=o.querySelector("input"); const isEx=(q.exclusive||[]).includes(i.value);
    i.checked=arr.includes(i.value); o.classList.toggle("sel",i.checked);
    const dis=!i.checked&&((full&&!isEx)||(ex&&!isEx)); i.disabled=dis; o.classList.toggle("dis",dis);});
}
function refreshVisibility(){
  QS.forEach(q=>{
    const card=document.getElementById("card_"+q.id); if(!card) return;
    const vis=!q.show||q.show(S.a);
    card.classList.toggle("hidden",!vis);
    if(!vis){ if(S.a[q.id]!==undefined){delete S.a[q.id];delete S.a[q.id+"_other"];if(q.id==="Q10")delete S.a.Q10_district;save();} card.dataset.key=""; }
    else if(q.dyn&&card.dataset.key!==dynKey(q)){ card.dataset.key=dynKey(q); fillOpts(q,card); }
  });
  const vis=visibleQs(); const lastId=vis.length?vis[vis.length-1].id:null;
  QS.forEach(q=>{ const b=document.querySelector("#card_"+q.id+" .btn-nq"); if(b) b.textContent=q.id===lastId?"К отправке ↓":"Следующий вопрос ↓"; });
  setProgress();
}
function dynKey(q){ return q.id==="Q9"?S.a.Q8:String(districtOf(S.a))+"/"+(unknownDistrict(S.a)?"grouped":""); }

/* ======================= ВАЛИДАЦИЯ / ОТПРАВКА ОТВЕТОВ ======================= */
function answered(q){
  const v=S.a[q.id];
  if(q.type==="multi") return Array.isArray(v)&&v.length>0&&(!q.other||!v.includes(q.other)||(S.a[q.id+"_other"]||"").trim().length>0);
  if(q.type==="matrix") return v&&q.rows.every(r=>v[r]);
  if(q.other&&v===q.other) return (S.a[q.id+"_other"]||"").trim().length>0;
  return !!v;
}
function validateAll(){
  let first=null;
  visibleQs().forEach(q=>{
    const card=document.getElementById("card_"+q.id); const ok=answered(q);
    card.classList.toggle("err",!ok);
    if(!ok){ card.querySelector(".errmsg").textContent=q.type==="matrix"?"Пожалуйста, ответьте в каждой строке.":(q.other&&S.a[q.id]&&(Array.isArray(S.a[q.id])?S.a[q.id].includes(q.other):S.a[q.id]===q.other))?"Пожалуйста, уточните ваш ответ.":"Пожалуйста, выберите ответ."; if(!first) first=card; }
  });
  if(first){ first.scrollIntoView({behavior:"smooth",block:"center"}); return false; }
  return true;
}
function finish(){ if(!validateAll()) return; S.status="complete"; S.ended=new Date().toISOString(); S.page=2; save(); send(false); render(); }

/* ======================= ОТПРАВКА ======================= */
let lastSent="", sendTimer=null;
function queueSend(){ clearTimeout(sendTimer); sendTimer=setTimeout(()=>send(false),1500); }
function payload(){
  const a=S.a; const ansd=QS.filter(q=>(!q.show||q.show(a))&&answered(q));
  const row={
    respondent_id:S.id, survey_version:SURVEY_VERSION, collector:S.src, start_date:S.started, end_date:S.ended||"", status:S.status,
    last_page:S.status==="complete"?PAGES:Math.max(0,...ansd.map(q=>q.page)), // «страница» по нумерации v1/v2 — для сравнения
    last_question:ansd.length?ansd[ansd.length-1].id:"", answered_n:ansd.length, updated:new Date().toISOString(),
  };
  // Q1: столбец на каждый вариант (как в экспорте SurveyMonkey)
  const q1=QUESTIONS.find(q=>q.id==="Q1"); const sel=Array.isArray(a.Q1)?a.Q1:[];
  q1.opts.forEach(o=>row["Q1 | "+o]=sel.includes(o)?o:"");
  row["Q1 | Иное (текст)"]=a.Q1_other||"";
  ["Q2","Q3","Q4","Q5","Q6","Q7","Q8"].forEach(k=>row[k]=a[k]||"");
  const d=effDistrict(a); row["Q9 | Округ №"]=d||(a.Q9||""); row["Q9 | источник"]=districtOf(a)?"вопрос":(a.Q10_district?"по кандидату":"");
  row["Q10"]=a.Q10||""; row["Q10 | Партия"]=d&&a.Q10?((CANDIDATES[d].c.find(c=>c[0]===a.Q10)||[])[1]||""):"";
  const m=QUESTIONS.find(q=>q.id==="Q11"); m.rows.forEach(r=>row["Q11 | "+r]=(a.Q11||{})[r]||"");
  row["Q12"]=a.Q12||""; row["Q13"]=a.Q13||""; row["Q13 | Другой (текст)"]=a.Q13_other||""; row["Q14"]=a.Q14||""; row["Q15"]=a.Q15||"";
  row["Q1 | порядок"]=(S.order.Q1||[]).join(",");
  return row;
}
function send(beacon){
  if(!ENDPOINT||ENDPOINT.startsWith("PASTE")) return;
  const row=payload(); if(!row.answered_n) return; // ничего не отправляем, пока нет ни одного ответа
  const body=JSON.stringify({survey:SURVEY_ID,row});
  const sig=body.replace(/"updated":"[^"]*"/,""); if(sig===lastSent) return; lastSent=sig;
  try{
    if(beacon&&navigator.sendBeacon){ navigator.sendBeacon(ENDPOINT,new Blob([body],{type:"text/plain"})); }
    else fetch(ENDPOINT,{method:"POST",mode:"no-cors",body,keepalive:true}).catch(()=>{});
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&S.page===1){ clearTimeout(sendTimer); send(true); } });
window.addEventListener("pagehide",()=>{ if(S.page===1){ clearTimeout(sendTimer); send(true); } });

load(); save(); render();
</script>
</body>
</html>
